services:
  - type: web
    name: casper-dao-postgres
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: RPC_URL
        value: http://65.109.83.79:7777/rpc
      - key: DATABASE_URL
        fromDatabase:
          name: casper-dao-postgres
          property: connectionString